name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --locked --release
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --release
      - name: Smoke test CLI
        shell: bash
        run: |
          ./target/release/uasset tests/data/DT_MyTable1.uasset | tee out.txt
          grep -q "NewRow1" out.txt
          ./target/release/uasset --json tests/data/DT_UE57.uasset > out.json
          grep -q '"rows"' out.json
